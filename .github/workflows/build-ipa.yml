name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'PandaPlayCore/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  # A real launch on the simulator. This is the gate: if the app dies at startup we get a
  # crash report in the job log instead of shipping another mystery IPA.
  simulator-smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(r["identifier"] for r in d["runtimes"] if r.get("isAvailable")))'

      - name: Boot a clean simulator
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[r["identifier"] for r in d["runtimes"] if r.get("platform")=="iOS" and r.get("isAvailable")]; print(sorted(ids)[-1])')
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[x["identifier"] for x in d["devicetypes"]]; pref="com.apple.CoreSimulator.SimDeviceType.iPhone-16"; print(pref if pref in ids else [i for i in ids if "iPhone" in i][-1])')
          DEVICE=$(xcrun simctl create PandaPlaySmoke "$DEVICE_TYPE" "$RUNTIME")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME type=$DEVICE_TYPE device=$DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Build for the simulator
        working-directory: App
        env:
          DEVICE: ${{ steps.sim.outputs.device }}
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/SimDerivedData
          xcodebuild \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Debug -sdk iphonesimulator \
            -destination "id=$DEVICE" \
            -derivedDataPath build/SimDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
          APP="build/SimDerivedData/Build/Products/Debug-iphonesimulator/PandaPlay.app"
          test -d "$APP" || { echo "simulator .app not found"; find build -maxdepth 7 -name '*.app' -print; exit 1; }
          echo "SIM_APP=$APP" >> "$GITHUB_ENV"

      - name: Verify Info.plist and the compiled icon
        working-directory: App
        run: |
          set -euo pipefail
          echo "--- scene manifest ---"
          /usr/bin/plutil -extract UIApplicationSceneManifest json -o - "$SIM_APP/Info.plist"
          echo "--- icon declaration ---"
          if ! /usr/bin/plutil -extract CFBundleIcons raw -o - "$SIM_APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::CFBundleIcons is missing — the app would show the grid placeholder again"
            /usr/bin/plutil -p "$SIM_APP/Info.plist"
            exit 1
          fi
          echo "--- compiled assets ---"
          ls -lh "$SIM_APP"/Assets.car 2>/dev/null || echo "(no Assets.car)"
          ls -1 "$SIM_APP" | grep -iE 'AppIcon|Assets.car' || true
          echo "--- localization sanity ---"
          /usr/bin/plutil -extract NSLocalNetworkUsageDescription raw -o - "$SIM_APP/Info.plist"

      - name: Launch and collect crash evidence
        working-directory: App
        env:
          DEVICE: ${{ steps.sim.outputs.device }}
        run: |
          set -euo pipefail
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$SIM_APP/Info.plist")
          CRASHDIR="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$CRASHDIR"
          BEFORE=$(find "$CRASHDIR" -maxdepth 1 -type f 2>/dev/null | sort)

          xcrun simctl install "$DEVICE" "$SIM_APP"
          echo "launching $BUNDLE"
          set +e
          LAUNCH_OUT=$(xcrun simctl launch "$DEVICE" "$BUNDLE" 2>&1)
          LAUNCH_RC=$?
          set -e
          echo "$LAUNCH_OUT"
          if [ "$LAUNCH_RC" -ne 0 ]; then
            echo "::error::simctl launch failed with rc=$LAUNCH_RC"
            exit 1
          fi
          PID=$(echo "$LAUNCH_OUT" | awk '{print $NF}')
          echo "pid=$PID"

          sleep 8

          AFTER=$(find "$CRASHDIR" -maxdepth 1 -type f 2>/dev/null | sort)
          NEW_CRASHES=$(comm -13 <(printf '%s\n' "$BEFORE") <(printf '%s\n' "$AFTER") | grep -i pandaplay || true)

          echo "--- unified log ---"
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact 2>/dev/null \
            | grep -iE 'PandaPlay|exception|terminat|crash|SIGABRT|SIGSEGV' | tail -n 80 || true

          echo "--- screenshot ---"
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/pandaplay-smoke.png" || true

          if [ -n "$NEW_CRASHES" ]; then
            echo "::error::crash report(s) generated:"
            printf '%s\n' "$NEW_CRASHES" | while read -r f; do
              echo "===== $f ====="
              cat "$f"
            done
            exit 1
          fi

          # `ps` is a real binary inside the simulator; probe it first so an absent tool
          # is not mistaken for a dead app.
          if xcrun simctl spawn "$DEVICE" /bin/ps -A >/dev/null 2>&1; then
            if ! xcrun simctl spawn "$DEVICE" /bin/ps -p "$PID" >/dev/null 2>&1; then
              echo "::error::process $PID is gone 8 seconds after launch"
              xcrun simctl spawn "$DEVICE" /bin/ps -A || true
              exit 1
            fi
            echo "process $PID alive after 8s — launch OK"
          else
            echo "(simulator ps unavailable; relied on crash-report detection)"
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            ${{ runner.temp }}/pandaplay-smoke.png
            ${{ runner.temp }}/*.ips
          if-no-files-found: ignore

      - name: Shut down the simulator
        if: always()
        env:
          DEVICE: ${{ steps.sim.outputs.device }}
        run: xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

  build-ipa:
    needs: [simulator-smoke]
    runs-on: macos-15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # Optional: when signing material is supplied, the output is a directly installable
      # IPA. Otherwise we still produce a structurally valid arm64 IPA that any free-Apple-ID
      # sideload tool can re-sign in one step.
      - name: Detect signing material
        id: sign
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set -> building unsigned IPA."
          fi

      - name: Import signing identity
        if: steps.sign.outputs.available == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID="$(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/bin/plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Resolve the local Swift package
        working-directory: App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DerivedData

      - name: Build for arm64 device
        working-directory: App
        env:
          SIGNED: ${{ steps.sign.outputs.available }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            SIGN_ARGS=(DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual
                       CODE_SIGN_IDENTITY="Apple Distribution"
                       PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID")
          else
            SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            "${SIGN_ARGS[@]}" build
          APP="build/DerivedData/Build/Products/Release-iphoneos/PandaPlay.app"
          test -d "$APP" || { echo "PandaPlay.app not found"; find build -maxdepth 6 -name '*.app' -print; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify the artifact
        working-directory: App
        run: |
          set -euo pipefail
          echo "--- Mach-O ---"
          lipo -info "$APP_PATH/PandaPlay" || file "$APP_PATH/PandaPlay"
          echo "--- Info.plist ---"
          /usr/bin/plutil -lint "$APP_PATH/Info.plist"
          /usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist"
          /usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist"
          echo "--- icon (must exist or the home screen shows a grid) ---"
          /usr/bin/plutil -extract CFBundleIcons json -o - "$APP_PATH/Info.plist" || {
            echo "::error::CFBundleIcons missing from the device build"; exit 1;
          }
          ls -1 "$APP_PATH" | grep -iE 'AppIcon|Assets.car' || {
            echo "::error::no compiled icon asset in the .app"; exit 1;
          }
          echo "--- scene manifest ---"
          /usr/bin/plutil -extract UIApplicationSceneManifest json -o - "$APP_PATH/Info.plist"
          echo "--- signature ---"
          codesign -dv "$APP_PATH" 2>&1 || echo "(unsigned, as expected)"

      - name: Package the IPA
        working-directory: App
        env:
          SIGNED: ${{ steps.sign.outputs.available }}
        run: |
          set -euo pipefail
          rm -rf Payload PandaPlay-unsigned.ipa PandaPlay-signed.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name '.DS_Store' -delete
          if [ "$SIGNED" = "true" ]; then
            IPA="PandaPlay-signed.ipa"
          else
            IPA="PandaPlay-unsigned.ipa"
          fi
          zip -qry "$IPA" Payload
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"
          unzip -l "$IPA" | tail -n 12

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaPlay-ipa
          path: App/${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish/refresh the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.sign.outputs.available }}
        working-directory: App
        run: |
          set -euo pipefail
          TAG="v1.3.0-rebuild"
          if [ "$SIGNED" = "true" ]; then
            STATE="已签名，可直接安装到 provisioning profile 中登记的设备。"
          else
            STATE="未签名 IPA（CI 无 Apple 签名材料）。iOS 不会直接安装，用下面任一种方式重签即可装到真机：
          - Sideloadly / AltStore / SideStore（免费 Apple ID，7 天）
          - Xcode → Devices and Simulators → 拖入 Payload/PandaPlay.app
          - 提供 IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_MOBILEPROVISION_BASE64 / IOS_TEAM_ID 四个 Secrets 后重跑本 workflow，CI 会直接产出已签名 IPA
          - 越狱设备可用 AppSync Unified 直接装"
          fi
          NOTES="PandaPlay+ 1.3 从零重做的 arm64 iOS 包。

          本次修复：补齐 AppIcon（不再是网格占位图）、补全 UIApplicationSceneManifest 的 UISceneConfigurations、修正启动屏与 Info.plist 编码；并新增 iOS 模拟器实跑冒烟测试作为发布门槛。

          $STATE

          源码与协议说明见仓库 README 与 docs/protocol.md。CI 在 macOS 15 + Xcode 上构建，产物已校验（arm64 Mach-O + 合法 Info.plist + 已编译图标）。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "PandaPlay+ 1.3 rebuilt (arm64 IPA)" --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,tagName,assets --jq '.url, (.assets[].name)'
