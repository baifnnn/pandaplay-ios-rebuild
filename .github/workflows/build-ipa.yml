name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'PandaPlayCore/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # Optional: when signing material is supplied, the output is a directly installable
      # IPA. Otherwise we still produce a structurally valid arm64 IPA that any free-Apple-ID
      # sideload tool can re-sign in one step.
      - name: Detect signing material
        id: sign
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ] && [ -n "$TEAM_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set -> building unsigned IPA."
          fi

      - name: Import signing identity
        if: steps.sign.outputs.available == 'true'
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD:-}" \
            -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID="$(/usr/bin/security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | /usr/bin/plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Resolve the local Swift package
        working-directory: App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build/DerivedData

      - name: Build for arm64 device
        working-directory: App
        env:
          SIGNED: ${{ steps.sign.outputs.available }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            SIGN_ARGS=(DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual
                       CODE_SIGN_IDENTITY="Apple Distribution"
                       PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID")
          else
            SIGN_ARGS=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="")
          fi
          xcodebuild \
            -project PandaPlay.xcodeproj -scheme PandaPlay \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            "${SIGN_ARGS[@]}" build
          APP="build/DerivedData/Build/Products/Release-iphoneos/PandaPlay.app"
          test -d "$APP" || { echo "PandaPlay.app not found"; find build -maxdepth 6 -name '*.app' -print; exit 1; }
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify the artifact
        working-directory: App
        run: |
          set -euo pipefail
          echo "--- Mach-O ---"
          lipo -info "$APP_PATH/PandaPlay" || file "$APP_PATH/PandaPlay"
          echo "--- Info.plist ---"
          /usr/bin/plutil -lint "$APP_PATH/Info.plist"
          /usr/bin/plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist"
          /usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist"
          echo "--- signature ---"
          codesign -dv "$APP_PATH" 2>&1 || echo "(unsigned, as expected)"

      - name: Package the IPA
        working-directory: App
        env:
          SIGNED: ${{ steps.sign.outputs.available }}
        run: |
          set -euo pipefail
          rm -rf Payload PandaPlay-unsigned.ipa PandaPlay-signed.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          find Payload -name '.DS_Store' -delete
          cp Payload/PandaPlay.app/embedded.mobileprovision "$RUNNER_TEMP/embedded.mobileprovision" 2>/dev/null || true
          if [ "$SIGNED" = "true" ]; then
            IPA="PandaPlay-signed.ipa"
          else
            IPA="PandaPlay-unsigned.ipa"
          fi
          zip -qry "$IPA" Payload
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          ls -lh "$IPA"
          unzip -l "$IPA" | tail -n 8

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PandaPlay-ipa
          path: App/${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish/refresh the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.sign.outputs.available }}
        working-directory: App
        run: |
          set -euo pipefail
          TAG="v1.3.0-rebuild"
          if [ "$SIGNED" = "true" ]; then
            STATE="已签名，可直接安装到 provisioning profile 中登记的设备。"
          else
            STATE="未签名 IPA（CI 无 Apple 签名材料）。iOS 不会直接安装，用下面任一种方式重签即可装到真机：
          - Sideloadly / AltStore / SideStore（免费 Apple ID，7 天）
          - Xcode → Devices and Simulators → 拖入 Payload/PandaPlay.app
          - 提供 IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_MOBILEPROVISION_BASE64 / IOS_TEAM_ID 四个 Secrets 后重跑本 workflow，CI 会直接产出已签名 IPA
          - 越狱设备可用 AppSync Unified 直接装"
          fi
          NOTES="PandaPlay+ 1.3 从零重做的 arm64 iOS 包。

          $STATE

          源码与协议说明见仓库 README 与 docs/protocol.md。CI 在 macOS 15 + Xcode 上构建，产物已校验（arm64 Mach-O + 合法 Info.plist）。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_NAME" --clobber
          else
            gh release create "$TAG" "$IPA_NAME" \
              --title "PandaPlay+ 1.3 rebuilt (arm64 IPA)" --notes "$NOTES"
          fi
          gh release view "$TAG" --json url,tagName,assets --jq '.url, (.assets[].name)'
